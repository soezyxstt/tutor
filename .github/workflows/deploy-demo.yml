name: Deploy Demo Course

on:
  push:
    branches: [main]
    paths:
      - 'apps/demo/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tutor-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build demo course
        run: pnpm build:demo

      - name: Deploy to Cloudflare Workers (demo.tutor.adihnursyam.com)
        working-directory: apps/demo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_PAGES_TOKEN }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
        run: |
          pnpm exec wrangler deploy --var "CF_ACCOUNT_ID:${CLOUDFLARE_ACCOUNT_ID}"
          if [ -n "${CF_AIG_TOKEN}" ]; then
            printf '%s' "${CF_AIG_TOKEN}" | pnpm exec wrangler secret put CF_AIG_TOKEN
          fi
